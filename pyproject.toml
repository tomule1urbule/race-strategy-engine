[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "race-strategy-engine"
version = "0.1.0"
description = "Algorithmic race strategy & nutrition generator for endurance runners and cyclists."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tomas Urbonas" }]
dependencies = [
    "pydantic>=2.6,<3",
    "numpy>=1.26",
    "pandas>=2.1",
    "gpxpy>=1.6",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.10", "ruff>=0.5", "pandas-stubs", "httpx>=0.27"]

[project.scripts]
race-strategy = "race_strategy.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "race_strategy.api"
disallow_untyped_decorators = false  # FastAPI decorators are untyped without its stubs installed

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
